name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile stock_analyzer.py web_app.py
      - name: Smoke test sample CSV
        run: python stock_analyzer.py --file examples/sample_prices.csv --output smoke-output
