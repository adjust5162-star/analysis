services:
  - type: web
    name: stock-lens
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: STOCK_API_PROVIDER
        value: yahoo
      - key: STOCK_API_KEY
        sync: false
      - key: ANALYSIS_DB_PATH
        value: /tmp/analysis.db
